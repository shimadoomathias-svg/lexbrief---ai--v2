services:
  - type: web
    name: lexbrief-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EVALUATOR_MODEL
        value: gpt-4.1
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: SESSION_TTL_MINUTES
        value: "120"
      - key: ENABLE_OCR
        value: "1"
